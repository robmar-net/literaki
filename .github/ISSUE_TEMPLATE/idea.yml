name: 💡 Propozycja / Idea
description: Czegoś brakuje albo dałoby się zrobić lepiej. / Something is missing, or could be better.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Pisz po polsku, angielsku, hiszpańsku lub ukraińsku — dowolnie.
        Write in Polish, English, Spanish or Ukrainian — whichever suits you.
        Escriba en polaco, inglés, español o ucraniano — como prefiera.
        Пишіть польською, англійською, іспанською або українською — як зручно.

        *Etykiety poniżej są po polsku i angielsku — odpowiadaj w swoim języku.*
        *The labels below are Polish and English — answer in your own language.*
  - type: textarea
    id: idea
    attributes:
      label: Propozycja / The idea
      description: Co i po co. Krótko wystarczy. / What, and what for. Short is fine.
    validations:
      required: true
